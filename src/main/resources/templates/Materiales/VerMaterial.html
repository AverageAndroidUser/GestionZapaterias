<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- icono app -->
    <link rel="icon" type="image/x-icon" href="/images/logo.png">

</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{barra}"></header>
    <div class="container mt-5">
        <button onclick="history.back()" type="button" class="btn btn-link link-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 6l-6 6l6 6" />
            </svg>
            Volver
        </button>
        <h2 class="my-3 text-center">Material</h2>
        <form th:object="${Materialess}">
            <fieldset disabled>
                <!-- Nombre -->
                <div class="mb-3">
                    <label for="Nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="Nombre" th:value="*{Nombre}" required>
                </div>

                <!-- Descripción -->
                <div class="mb-3">
                    <label for="Descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="Descripcion" th:text="*{Descripcion}" required></textarea>
                </div>

                <div class="row mb-3">
                    <!-- Cantidad -->
                    <div class="col">
                        <label for="cantidad" class="form-label">Cantidad</label>
                        <input type="text" class="form-control" id="cantidad"
                            th:value="*{cantidad} + ' ' + *{tipoMaterial.Unidad_medida}" required>
                    </div>

                    <!-- Costo por unidad -->
                    <div class="col">
                        <label for="costoUnidad" class="form-label">Costo por unidad</label>
                        <input type="number" class="form-control" id="costoUnidad" th:value="*{costoUnidad}" required>
                    </div>

                    <!-- Stock mínimo -->
                    <div class="col">
                        <label for="stockMinimo" class="form-label">Stock mínimo</label>
                        <input type="number" class="form-control" id="stockMinimo" th:value="*{stockMinimo}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <!-- Fecha de actualización -->
                    <div class="col">
                        <label for="fechaActualizacion" class="form-label">Fecha de actualización</label>
                        <input type="date" class="form-control" id="fechaActualizacion" th:value="*{fechaActualizacion}"
                            required>
                    </div>

                    <!-- Tipo de material -->
                    <div class="col">
                        <label for="tipoMaterialLista" class="form-label">Tipo de Material</label>
                        <input type="text" class="form-control" id="cantidad" th:value="*{tipoMaterial.Descripcion}"
                            required>
                    </div>

                    <!-- Proveedor -->
                    <div class="col">
                        <label for="proveedorLista" class="form-label">Proveedor</label>
                        <a
                            th:href="@{/GestionZapaterias/Proveedores/VerProveedor/} + ${Materialess.clienteProveedores.ID_Cliente_proveedor}">
                            <div class="form-control link-primary">
                                <span th:text="${Materialess.clienteProveedores.Nombre}"></span>
                            </div>
                        </a>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
    <footer th:replace="~{piePagina}"></footer>
</body>

</html>
