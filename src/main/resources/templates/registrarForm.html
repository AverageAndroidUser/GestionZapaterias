<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <!-- icono app -->
    <link rel="icon" type="image/x-icon" href="/images/logo.png">

    <title>Login - Gestion de Zapaterias</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form th:action="@{/GestionZapaterias/guardarUsuario}" method="post" th:object="${Usuarioss}">
                <h1>CREAR CUENTA</h1>
                <hr />
                <div class="group-input">
                    <i class="fa fa-lock"></i>
                    <input type="text" placeholder="Nombre de la Zapateria" th:field="${Usuarioss.Zapateria}" required
                        minlength="10" maxlength="45">
                </div>
                <div class="group-input">
                    <i class="fa fa-lock"></i>
                    <input type="text" placeholder="Nombre del Encargado" th:field=${Usuarioss.Encargado} required
                        minlength="10" maxlength="80" />
                </div>
                <div class="group-input">
                    <i class="fa fa-envelope"></i>
                    <input type="number" placeholder="Número Telefonico" th:field="${Usuarioss.Telefono}" />
                </div>
                <div class="group-input">
                    <i class="fa fa-lock"></i>
                    <input id="NumeroCelular" type="tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                        placeholder="Número Celular" th:field="${Usuarioss.Celular}" required />
                </div>
                <div class="group-input">
                    <i class="fa fa-envelope"></i>
                    <input type="email" placeholder="Correo Electronico" th:field="${Usuarioss.Correo}" required />
                </div>
                <div class="group-input">
                    <i class="fa fa-lock"></i>
                    <input type="text" placeholder="Dirección de la Zapateria" th:field="${Usuarioss.Direccion}"
                        required minlength="10" maxlength="100">
                </div>
                <div class="combo">
                    <div class="group-input" style="margin-right: 10px; padding-top: 10px;">
                        <select id="departamentoLista" th:field="${Usuarioss.municipio.departamento}" required>
                            <option value="" hidden>Departamento</option>
                            <option th:each="departamento:${Departamentoss}" th:value="${departamento.ID_Departamento}"
                                th:text="${departamento.Nombre}"></option>
                        </select>
                    </div>
                    <div class="group-input">
                        <i class="fa fa-lock"></i>
                        <select id="municipioLista" th:field="${Usuarioss.municipio}" required
                            style="margin-top: 10px;">
                            <option value="" hidden>Ciudad</option>
                        </select>
                    </div>
                </div>
                <div class="group-input">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="Password" pattern="[*\S$]+" title="Sin espacios" required
                        minlength="6" maxlength="15" th:field="${Usuarioss.Contraseña}" />
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form method="post" th:action="@{/login}">
                <h1>ENTRAR</h1>
                <hr />
                <div th:if="${param.error}" class="error-message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="currentColor"
                        class="icon icon-tabler icons-tabler-filled icon-tabler-alert-square-rounded">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                            d="M12 2l.642 .005l.616 .017l.299 .013l.579 .034l.553 .046c4.687 .455 6.65 2.333 7.166 6.906l.03 .29l.046 .553l.041 .727l.006 .15l.017 .617l.005 .642l-.005 .642l-.017 .616l-.013 .299l-.034 .579l-.046 .553c-.455 4.687 -2.333 6.65 -6.906 7.166l-.29 .03l-.553 .046l-.727 .041l-.15 .006l-.617 .017l-.642 .005l-.642 -.005l-.616 -.017l-.299 -.013l-.579 -.034l-.553 -.046c-4.687 -.455 -6.65 -2.333 -7.166 -6.906l-.03 -.29l-.046 -.553l-.041 -.727l-.006 -.15l-.017 -.617l-.004 -.318v-.648l.004 -.318l.017 -.616l.013 -.299l.034 -.579l.046 -.553c.455 -4.687 2.333 -6.65 6.906 -7.166l.29 -.03l.553 -.046l.727 -.041l.15 -.006l.617 -.017c.21 -.003 .424 -.005 .642 -.005zm.01 13l-.127 .007a1 1 0 0 0 0 1.986l.117 .007l.127 -.007a1 1 0 0 0 0 -1.986l-.117 -.007zm-.01 -8a1 1 0 0 0 -.993 .883l-.007 .117v4l.007 .117a1 1 0 0 0 1.986 0l.007 -.117v-4l-.007 -.117a1 1 0 0 0 -.993 -.883z" />
                    </svg>
                    Usuario o contraseña inválidos.
                </div>
                <div class="group-input">
                    <i class="fa fa-envelope"></i>
                    <input type="text" placeholder="Usuario" name="Correo" required />
                </div>

                <div class="group-input">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="Contraseña" name="Contraseña" required />
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <div class="side-element-container">
            <div class="side-element">
                <div class="side-element-panel side-element-left">
                    <h1>¡Hola!</h1>
                    <p>Rellena el formulario y comienza a gestionar tu zapatería</p>
                    <button class="ghost" id="signIn">ENTRAR</button>
                </div>
                <div class="side-element-panel side-element-right">
                    <h1>¡Bienvenido!</h1>
                    <p>
                        Estamos felices de verte de nuevo.
                    </p>
                    <button class="ghost" id="signUp">REGISTRARSE</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script th:src="@{/js/app.js}"></script>

</html>
