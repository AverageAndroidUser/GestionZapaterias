<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- icono app -->
    <link rel="icon" type="image/x-icon" href="/images/logo.png">
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{barra}"></header>
    <div class="container mt-5">
        <button onclick="history.back()" type="button" class="btn btn-link link-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 6l-6 6l6 6" />
            </svg>
            Volver
        </button>
        <h2 class="my-3 text-center">Proveedor</h2>
        <form th:object="${Proveedoress}">
            <fieldset disabled>
                <!-- Nombre -->
                <div class="mb-3">
                    <label for="Nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="Nombre" th:field="*{Nombre}" required>
                </div>

                <div class="row mb-3">
                    <!-- Teléfono -->
                    <div class="col-3">
                        <label for="Telefono" class="form-label">Teléfono</label>
                        <input type="number" class="form-control" id="Telefono" th:field="*{Telefono}" required>
                    </div>

                    <!-- Celular -->
                    <div class="col-3">
                        <label for="Celular" class="form-label">Celular</label>
                        <input id="NumeroCelular" type="tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" class="form-control"
                            th:field="*{Celular}" required>
                    </div>

                    <!-- Correo -->
                    <div class="col-6">
                        <label for="Correo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="Correo" th:field="*{Correo}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <!-- Dirección -->
                    <div class="col">
                        <label for="Direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="Direccion" th:field="*{Direccion}" required>
                    </div>

                    <!-- Departamento -->
                    <div class="col">
                        <label for="Departamento" class="form-label">Departamento</label>
                        <input type="text" class="form-control" id="Departamento"
                            th:field="${Proveedoress.municipio.departamento.Nombre}" required>
                    </div>

                    <!-- Municipio -->
                    <div class="col">
                        <label for="Municipio" class="form-label">Municipio</label>
                        <input type="text" class="form-control" id="Municipio"
                            th:field="${Proveedoress.municipio.Nombre}" required>
                    </div>
                </div>
                <!-- Tipos de Material -->
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-6">Tipos Materiales:</label>
                    <div class="form-control" style="background-color: var(--bs-secondary-bg); opacity: 1;">
                        <span th:each="tipo, iterStat : ${Tiposs}">
                            <span th:text="${tipo.Tipo_material.Descripcion + (iterStat.last ? '' : ', ')}"></span>
                        </span>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>

    <footer th:replace="~{piePagina}"></footer>
</body>

</html>
