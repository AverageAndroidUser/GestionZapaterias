<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- icono app -->
    <link rel="icon" type="image/x-icon" href="/images/logo.png">
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{barra}"></header>
    <div class="container mt-5">
        <button onclick="history.back()" type="button" class="btn btn-link link-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 6l-6 6l6 6" />
            </svg>
            Volver
        </button>
        <h2 class="my-3 text-center">Producto</h2>
        <form th:object="${Productoss}">
            <fieldset disabled>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{Nombre}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="referencia" class="form-label">Referencia</label>
                        <input type="text" id="referencia" class="form-control" th:field="*{Referencia}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" th:field="*{Descripcion}" rows="3"
                        required></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="precio" class="form-label">Precio Unitario</label>
                        <input type="number" id="precio" class="form-control" th:field="*{precioUnitario}" required
                            min="0">
                    </div>
                    <div class="col-md-6">
                        <label for="tipoProducto" class="form-label">Tipo de Producto</label>
                        <input type="text" id="precio" class="form-control" th:field="*{tipo_producto.Descripcion}"
                            required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="material" class="form-label">Material</label>
                    <input type="text" id="precio" class="form-control" th:field="*{materiales.Nombre}" required>
                </div>
            </fieldset>
        </form>
    </div>
    <footer th:replace="~{piePagina}"></footer>
</body>

</html>
